// ── In-memory rubric library ───────────────────────────────────────────────
var RUBRIC_LIBRARY_STORAGE_KEY = 'rubricCheckerLibrary';

function loadStoredRubricLibrary() {
  try {
    var stored = localStorage.getItem(RUBRIC_LIBRARY_STORAGE_KEY);
    if (!stored) return {};
    var parsed = JSON.parse(stored);
    if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) return {};

    var library = {};
    Object.keys(parsed).forEach(function(rubricId) {
      var rubric = parsed[rubricId];
      if (rubric && rubric.rubric_id === rubricId && !validateRubric(rubric)) {
        library[rubricId] = JSON.parse(JSON.stringify(rubric));
      }
    });
    return library;
  } catch(e) {
    return {};
  }
}

var _library = loadStoredRubricLibrary();

function persistRubricLibrary() {
  try {
    localStorage.setItem(RUBRIC_LIBRARY_STORAGE_KEY, JSON.stringify(_library));
  } catch(e) {}
}

function saveRubricToLibrary(rubricData) {
  _library[rubricData.rubric_id] = JSON.parse(JSON.stringify(rubricData));
  persistRubricLibrary();
}

function loadLibrary() {
  return JSON.parse(JSON.stringify(_library));
}

function deleteRubricFromLibrary(rubric_id) {
  delete _library[rubric_id];
  persistRubricLibrary();
}

function listLibrary() {
  return Object.values(_library).map(function(r) {
    return { rubric_id: r.rubric_id, title: r.title };
  });
}

// Cycle: blank → complete → almost → not_started → blank
var CYCLE = ['blank', 'complete', 'almost', 'not_started'];

function cycleStatus(current) {
  var idx = CYCLE.indexOf(current);
  return CYCLE[(idx + 1) % CYCLE.length];
}

// ── Deep copy + reset statuses ─────────────────────────────────────────────
function resetItemStatuses(item) {
  item.status = 'blank';
  if (item.sub_items) {
    item.sub_items.forEach(function(sub) { resetItemStatuses(sub); });
  }
}

function deepCopyAndReset(rubricData) {
  var copy = JSON.parse(JSON.stringify(rubricData));
  copy.criteria.forEach(function(criterion) {
    criterion.levels.forEach(function(level) {
      if (level.descriptor_type === 'checklist' && level.items) {
        level.items.forEach(function(item) { resetItemStatuses(item); });
      }
    });
  });
  return copy;
}

// ── Validation ─────────────────────────────────────────────────────────────
function validateItem(item, path) {
  if (typeof item.id !== 'string' || !item.id) return path + '.id must be a non-empty string';
  if (typeof item.text !== 'string' || !item.text) return path + '.text must be a non-empty string';
  if (typeof item.status !== 'string') return path + '.status must be a string';
  if (item.sub_items) {
    if (!Array.isArray(item.sub_items)) return path + '.sub_items must be an array';
    for (var i = 0; i < item.sub_items.length; i++) {
      var err = validateItem(item.sub_items[i], path + '.sub_items[' + i + ']');
      if (err) return err;
    }
  }
  return null;
}

function validateRubric(obj) {
  if (!obj || typeof obj !== 'object') return 'JSON must be an object';
  if (typeof obj.rubric_id !== 'string' || !obj.rubric_id) return 'rubric_id must be a non-empty string';
  if (typeof obj.title !== 'string' || !obj.title) return 'title must be a non-empty string';
  if (!Array.isArray(obj.criteria) || obj.criteria.length === 0) return 'criteria must be a non-empty array';
  for (var ci = 0; ci < obj.criteria.length; ci++) {
    var c = obj.criteria[ci];
    var cp = 'criteria[' + ci + ']';
    if (typeof c.id !== 'string' || !c.id) return cp + '.id must be a non-empty string';
    if (typeof c.name !== 'string' || !c.name) return cp + '.name must be a non-empty string';
    if (!Array.isArray(c.levels) || c.levels.length === 0) return cp + '.levels must be a non-empty array';
    for (var li = 0; li < c.levels.length; li++) {
      var lv = c.levels[li];
      var lp = cp + '.levels[' + li + ']';
      if (typeof lv.band !== 'string') return lp + '.band must be a string';
      if (typeof lv.band_label !== 'string') return lp + '.band_label must be a string';
      if (lv.descriptor_type !== 'narrative' && lv.descriptor_type !== 'checklist') return lp + '.descriptor_type must be "narrative" or "checklist"';
      if (lv.descriptor_type === 'narrative') {
        if (typeof lv.narrative !== 'string' || !lv.narrative) return lp + '.narrative must be a non-empty string';
      }
      if (lv.descriptor_type === 'checklist') {
        if (!Array.isArray(lv.items)) return lp + '.items must be an array';
        for (var ii = 0; ii < lv.items.length; ii++) {
          var err = validateItem(lv.items[ii], lp + '.items[' + ii + ']');
          if (err) return err;
        }
      }
    }
  }
  return null;
}

function importRubricJSON(jsonText) {
  var obj;
  try { obj = JSON.parse(jsonText); } catch(e) { return 'Invalid JSON: ' + e.message; }
  var err = validateRubric(obj);
  if (err) return 'Validation error: ' + err;
  var cleaned = deepCopyAndReset(obj);
  saveRubricToLibrary(cleaned);
  return null;
}

function loadCompletedRubricJSON(jsonText) {
  var rubric;
  try {
    rubric = JSON.parse(jsonText);
  } catch(e) {
    return 'Invalid JSON: ' + e.message;
  }

  var err = validateRubric(rubric);
  if (err) return 'Validation error: ' + err;
  if (typeof rubric.student_name !== 'string') {
    return 'This file does not include a student name. Choose an exported completed rubric JSON file.';
  }

  activeRubric = JSON.parse(JSON.stringify(rubric));
  studentName = rubric.student_name;
  assessmentComments = typeof rubric.comments === 'string' ? rubric.comments : '';
  commentsExpanded = false;
  selectedTag = '';
  currentView = 'full';
  completedLoadMessage = 'Loaded completed assessment for ' + studentName + '.';
  return null;
}

// ── Progress ───────────────────────────────────────────────────────────────
function getProgress(criterionId) {
  var total = 0, complete = 0;
  var criterion = activeRubric.criteria.find(function(c) { return c.id === criterionId; });
  criterion.levels.forEach(function(level) {
    if (level.descriptor_type === 'checklist') {
      level.items.forEach(function(item) {
        total++;
        if (item.status === 'complete') complete++;
        if (item.sub_items) {
          item.sub_items.forEach(function(sub) {
            total++;
            if (sub.status === 'complete') complete++;
          });
        }
      });
    }
  });
  return { total: total, complete: complete };
}

function findItem(id) {
  for (var ci = 0; ci < activeRubric.criteria.length; ci++) {
    var criterion = activeRubric.criteria[ci];
    for (var li = 0; li < criterion.levels.length; li++) {
      var level = criterion.levels[li];
      if (level.descriptor_type === 'checklist') {
        for (var ii = 0; ii < level.items.length; ii++) {
          var item = level.items[ii];
          if (item.id === id) return item;
          if (item.sub_items) {
            for (var si = 0; si < item.sub_items.length; si++) {
              if (item.sub_items[si].id === id) return item.sub_items[si];
            }
          }
        }
      }
    }
  }
  return null;
}

function toggleItem(id) {
  var item = findItem(id);
  if (!item) return;
  item.status = cycleStatus(item.status);
  render();
}

// ── Formatting helpers ─────────────────────────────────────────────────────
function formatDate(d) {
  var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
}

function sanitizeFilename(name) {
  return name.replace(/[^a-zA-Z0-9_\-]/g, '_').replace(/_+/g, '_').replace(/^_|_$/g, '') || 'Student';
}

function statusLabel(status) {
  if (status === 'blank') return '';
  if (status === 'complete') return 'Complete';
  if (status === 'almost') return 'Almost';
  return 'Not Done';
}

function pillClass(status) {
  return 'status-pill ' + status;
}

// ── Export ─────────────────────────────────────────────────────────────────
function escapePipe(text) {
  return text.replace(/\|/g, '\\|');
}

function buildMarkdown() {
  var now = formatDate(new Date());
  var md = '';
  md += '# ' + activeRubric.title + '\n\n';
  md += '**Student:** ' + studentName + '  \n';
  md += '**Date:** ' + now + '\n\n';
  md += '---\n\n';

  activeRubric.criteria.forEach(function(criterion) {
    md += '## ' + criterion.name + '\n\n';
    criterion.levels.forEach(function(level) {
      md += '### Band ' + level.band_label + '\n\n';
      if (level.descriptor_type === 'narrative') {
        md += '> ' + level.narrative + '\n\n';
      } else {
        if (level.preamble) md += '_' + level.preamble + '_\n\n';
        md += '| Status | Item |\n';
        md += '|--------|------|\n';
        level.items.forEach(function(item) {
          md += '| ' + statusLabel(item.status) + ' | ' + escapePipe(item.text) + ' |\n';
          if (item.sub_items) {
            item.sub_items.forEach(function(sub) {
              md += '| ' + statusLabel(sub.status) + ' |   -> ' + escapePipe(sub.text) + ' |\n';
            });
          }
        });
        md += '\n';
      }
    });
    md += '\n';
  });
  md += '## Comments\n\n';
  if (assessmentComments) md += assessmentComments + '\n';
  md += '\n';
  return md;
}

function escapeHTML(text) {
  return String(text).replace(/[&<>"']/g, function(character) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character];
  });
}

function statusColors(status) {
  if (status === 'complete') return { background: '#dcfce7', color: '#166534' };
  if (status === 'almost') return { background: '#fef3c7', color: '#92400e' };
  if (status === 'not_started') return { background: '#fee2e2', color: '#991b1b' };
  return { background: '#f3f4f6', color: '#4b5563' };
}

      }
      if (level.preamble) html += '<p style="font-family:Arial,sans-serif;font-size:8pt;line-height:1.1;margin:2pt 0"><em>' + escapeHTML(level.preamble) + '</em></p>';
      html += '<table border="1" cellpadding="3" cellspacing="0" style="border-collapse:collapse;font-family:Arial,sans-serif;font-size:8pt;line-height:1.05;width:100%"><thead><tr><th style="background-color:#e5e7eb;text-align:left;width:68px">Status</th><th style="background-color:#e5e7eb;text-align:left">Item</th></tr></thead><tbody>';

function buildGoogleDocsPlainText() {
  var lines = ['Student: ' + studentName, activeRubric.title, 'Date: ' + formatDate(new Date()), ''];

      lines.push('Band ' + level.band_label);
      if (level.descriptor_type === 'narrative') {
        lines.push(level.narrative);
      } else {
        if (level.preamble) lines.push(level.preamble);
        level.items.forEach(function(item) {
          lines.push((statusLabel(item.status) || 'Blank') + ': ' + item.text);
          (item.sub_items || []).forEach(function(subItem) {
            lines.push('  ' + (statusLabel(subItem.status) || 'Blank') + ': ' + subItem.text);
          });
        });
      }
      lines.push('');
    });
  });
  lines.push('Comments:');
  if (assessmentComments) lines.push(assessmentComments);
  lines.push('');
  lines.push('');
  return lines.join('\n');
}

function copyRichContentFallback(html) {
  var container = document.createElement('div');
  container.contentEditable = 'true';
  container.style.cssText = 'position:fixed;left:-10000px;top:0;';
  container.innerHTML = html;
  document.body.appendChild(container);
  var range = document.createRange();
  range.selectNodeContents(container);
  var selection = window.getSelection();
  selection.removeAllRanges();
  selection.addRange(range);
  var copied = document.execCommand('copy');
  selection.removeAllRanges();
  document.body.removeChild(container);
  return copied;
}

function copyForGoogleDocs(statusElement) {
  var html = buildGoogleDocsHTML();
  var plainText = buildGoogleDocsPlainText();
  var copied = function() { statusElement.textContent = 'Copied. Paste into Google Docs.'; };
  var failed = function() {
    statusElement.textContent = copyRichContentFallback(html)
      ? 'Copied. Paste into Google Docs.'
      : 'Copy was blocked. Select and copy the rubric from Full View.';
  };

  if (navigator.clipboard && window.ClipboardItem) {
    navigator.clipboard.write([new ClipboardItem({
      'text/html': new Blob([html], { type: 'text/html' }),
      'text/plain': new Blob([plainText], { type: 'text/plain' })
    })]).then(copied).catch(failed);
  } else {
    failed();
  }
}

function buildJSON() {
  var out = JSON.parse(JSON.stringify(activeRubric));
  out.student_name = studentName;
  out.comments = assessmentComments;
  out.exported_at = new Date().toISOString();
  return JSON.stringify(out, null, 2);

function downloadFile(content, filename, mimeType) {
  var blob = new Blob([content], { type: mimeType });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
}

  render();
}

function exportJSON() {
  var fname = sanitizeFilename(studentName) + '_' + sanitizeFilename(activeRubric.rubric_id) + '_Rubric.json';
  downloadFile(buildJSON(), fname, 'application/json');
}

// ── Render helpers ─────────────────────────────────────────────────────────
function renderStatusPill(status) {
  var el = document.createElement('span');
  el.className = pillClass(status);
  el.textContent = statusLabel(status);
  return el;
}

function renderChecklistItem(item, isSub) {
  var row = document.createElement('div');
  row.className = 'checklist-item' + (isSub ? ' subitem' : '');
  row.tabIndex = 0;
  row.setAttribute('role', 'button');
  row.setAttribute('aria-label', item.text + ', status: ' + (statusLabel(item.status) || 'Blank') + '. Click to cycle.');

  var pill = renderStatusPill(item.status);
  var textEl = document.createElement('span');
  textEl.className = 'item-text';
  textEl.textContent = item.text;

  row.appendChild(pill);
  row.appendChild(textEl);

  function doToggle() { toggleItem(item.id); }
  row.addEventListener('click', doToggle);
  row.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); doToggle(); }
  });

  return row;
}

function getItemTags(item) {
  return [item.tag, item.tags].filter(function(value) {
    return typeof value === 'string';
  }).join(',').split(',').map(function(tag) {
    return tag.trim();
  }).filter(Boolean);
}

function itemHasTag(item, tag) {
  return getItemTags(item).indexOf(tag) !== -1;
}

function getRubricTags(rubric) {
  var tags = [];
  var seen = Object.create(null);
  rubric.criteria.forEach(function(criterion) {
    criterion.levels.forEach(function(level) {
      if (level.descriptor_type !== 'checklist') return;
      level.items.forEach(function(item) {
        [item].concat(item.sub_items || []).forEach(function(taggedItem) {
          getItemTags(taggedItem).forEach(function(tag) {
            if (!seen[tag]) {
              seen[tag] = true;
              tags.push(tag);
            }
          });
        });
      });
    });
  });
  return tags;
}

function levelHasTag(level, tag) {
  return level.descriptor_type === 'checklist' && level.items.some(function(item) {
    return itemHasTag(item, tag) || (item.sub_items || []).some(function(sub) { return itemHasTag(sub, tag); });
  });
}

function renderLevel(level, tagFilter) {
  var section = document.createElement('div');
  section.className = 'band-section';

  var header = document.createElement('div');
  header.className = 'band-header';
  header.textContent = 'Band ' + level.band_label;
  section.appendChild(header);

  if (level.descriptor_type === 'narrative') {
    var p = document.createElement('p');
    p.className = 'narrative-text';
    p.textContent = level.narrative;
    section.appendChild(p);
  } else {
    if (level.preamble) {
      var pre = document.createElement('p');
      pre.className = 'preamble-text';
      pre.textContent = level.preamble;
      section.appendChild(pre);
    }
    level.items.forEach(function(item) {
      if (!tagFilter || itemHasTag(item, tagFilter)) {
        section.appendChild(renderChecklistItem(item, false));
      }
      if (item.sub_items) {
        item.sub_items.forEach(function(sub) {
          if (!tagFilter || itemHasTag(sub, tagFilter)) {
            section.appendChild(renderChecklistItem(sub, true));
          }
        });
      }
    });
  }

  return section;
}

function renderCriterionCard(criterion, focusBandFilter, tagFilter) {
  var card = document.createElement('div');
  card.className = 'criterion-card';

  var title = document.createElement('h2');
  title.className = 'criterion-title';
  title.textContent = criterion.name;
  card.appendChild(title);

  var levels = criterion.levels;
  if (tagFilter) {
    levels = levels.map(function(level, index) {
      return { level: level, index: index, bandOrder: parseInt(level.band, 10) };
    }).filter(function(entry) {
      return levelHasTag(entry.level, tagFilter);
    }).sort(function(a, b) {
      if (Number.isNaN(a.bandOrder) || Number.isNaN(b.bandOrder)) return a.index - b.index;
      return a.bandOrder - b.bandOrder;
    }).map(function(entry) { return entry.level; });
    if (!levels.length) return null;
  }

  levels.forEach(function(level) {
    if (focusBandFilter && level.band !== focusBandFilter) return;
    card.appendChild(renderLevel(level, tagFilter));
  });

  return card;
}

function renderProgressBar() {
  var bar = document.createElement('div');
  bar.className = 'progress-bar';
  bar.setAttribute('aria-live', 'polite');
  bar.setAttribute('aria-atomic', 'true');

  activeRubric.criteria.forEach(function(criterion) {
    var prog = getProgress(criterion.id);
    var shortName = criterion.name.split(':')[0];
    var span = document.createElement('span');
    span.textContent = shortName + ': ' + prog.complete + ' / ' + prog.total + ' complete';
    bar.appendChild(span);
  });

  return bar;
}

  app.appendChild(pageHeader);

  var wrap = document.createElement('div');
  wrap.className = 'library-wrap';

  var errEl = document.createElement('p');
  errEl.className = 'library-error';
  errEl.setAttribute('role', 'alert');
  errEl.textContent = libraryError;

  var importRow = document.createElement('div');
  importRow.className = 'library-import-row';
  importRow.style.marginBottom = '1rem';

  var fileBtn = document.createElement('button');
  fileBtn.className = 'btn-export';
  fileBtn.textContent = 'Import Rubric JSON';
  fileBtn.addEventListener('click', function() {
    document.getElementById('file-import-input').value = '';
    document.getElementById('file-import-input').click();
  });

  var pasteBtn = document.createElement('button');
  pasteBtn.className = 'btn-export';
  pasteBtn.textContent = 'Paste JSON';
  pasteBtn.addEventListener('click', function() {
    showPasteOverlay = true;
    render();
  });

  importRow.appendChild(fileBtn);
  importRow.appendChild(pasteBtn);
  importRow.appendChild(errEl);

  wrap.appendChild(importRow);

  var list = listLibrary();
  var grid = document.createElement('div');
  grid.className = 'library-grid';

  list.forEach(function(entry) {
    var card = document.createElement('div');
    card.className = 'library-card';

    var titleEl = document.createElement('div');
    titleEl.className = 'library-card-title';
    titleEl.textContent = entry.title;

    var idEl = document.createElement('div');
    idEl.className = 'library-card-id';
    idEl.textContent = entry.rubric_id;

    var actions = document.createElement('div');
    actions.className = 'library-card-actions';

    var selectBtn = document.createElement('button');
    selectBtn.className = 'btn-select';
    selectBtn.textContent = 'Select';
    selectBtn.addEventListener('click', (function(rid) {
      return function() {
        var lib = loadLibrary();
        var rubric = lib[rid];
        if (!rubric) return;
        activeRubric = deepCopyAndReset(rubric);
        studentName = '';
        selectedTag = '';
        assessmentComments = '';
        commentsExpanded = false;
        currentView = 'welcome';
        libraryError = '';
        render();
      };
    })(entry.rubric_id));

    var editBtn = document.createElement('button');
    editBtn.className = 'btn-export';
    editBtn.textContent = 'Edit JSON';
    editBtn.addEventListener('click', function() {
      editingRubricId = entry.rubric_id;
      showRubricEditor = true;
      render();
    });

    var exportBtn = document.createElement('button');
    exportBtn.className = 'btn-export';
    exportBtn.textContent = 'Export JSON';
    exportBtn.addEventListener('click', function() {
      var rubric = _library[entry.rubric_id];
      var filename = sanitizeFilename(rubric.title) + '.json';
      downloadFile(JSON.stringify(rubric, null, 2), filename, 'application/json');
    });

    var delBtn = document.createElement('button');
    delBtn.className = 'btn-delete';
    delBtn.title = 'Delete this rubric';
    delBtn.textContent = '\uD83D\uDDD1';
    delBtn.setAttribute('aria-label', 'Delete ' + entry.title);
    delBtn.addEventListener('click', (function(rid, rtitle) {
      return function() {
        var list2 = listLibrary();
        if (list2.length <= 1) {
          libraryError = 'Cannot delete the only remaining rubric.';
          render();
          return;
        }
        var confirmed = confirm("Delete '" + rtitle + "'?");
        if (!confirmed) return;
        deleteRubricFromLibrary(rid);
        libraryError = '';
        render();
      };
    })(entry.rubric_id, entry.title));

    actions.appendChild(selectBtn);
    actions.appendChild(editBtn);
    actions.appendChild(exportBtn);
    card.appendChild(delBtn);
    card.appendChild(titleEl);
    card.appendChild(idEl);
    card.appendChild(actions);
    grid.appendChild(card);
  });

  wrap.appendChild(grid);
  app.appendChild(wrap);

  if (showPasteOverlay) {
    renderPasteOverlay(app);
  }
  if (showRubricEditor) {
    renderRubricEditor(app);
  }
}

// ── Paste overlay ──────────────────────────────────────────────────────────
function renderPasteOverlay(app) {
  var backdrop = document.createElement('div');
  backdrop.className = 'overlay-backdrop';

  var panel = document.createElement('div');
  panel.className = 'overlay-panel';
  panel.setAttribute('role', 'dialog');
  panel.setAttribute('aria-modal', 'true');
  panel.setAttribute('aria-label', 'Paste Rubric JSON');

  var h3 = document.createElement('h3');
  h3.textContent = 'Paste Rubric JSON';
  panel.appendChild(h3);

  var hint = document.createElement('p');
  hint.style.cssText = 'margin:0;font-size:0.82rem;color:#5a6a7e;';
  hint.textContent = 'Paste a valid rubric JSON object below, then click Load.';
  panel.appendChild(hint);

  var ta = document.createElement('textarea');
  ta.placeholder = '{ "rubric_id": "...", "title": "...", "criteria": [...] }';
  panel.appendChild(ta);

  var errEl = document.createElement('p');
  errEl.className = 'overlay-error';
  errEl.setAttribute('role', 'alert');
  errEl.textContent = '';
  panel.appendChild(errEl);

  var btnRow = document.createElement('div');
  btnRow.className = 'overlay-btn-row';

  var loadBtn = document.createElement('button');
  loadBtn.className = 'btn-overlay-load';
  loadBtn.textContent = 'Load';
  loadBtn.addEventListener('click', function() {
    var err = importRubricJSON(ta.value);
    if (err) {
      ta.classList.add('invalid');
      errEl.textContent = err;
    } else {
      ta.classList.remove('invalid');
      showPasteOverlay = false;
      libraryError = '';
      render();
    }
  });

  var cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn-overlay-cancel';
  cancelBtn.textContent = 'Cancel';
  cancelBtn.addEventListener('click', function() {
    showPasteOverlay = false;
    render();
  });

  backdrop.addEventListener('click', function(e) {
    if (e.target === backdrop) {
      showPasteOverlay = false;
      render();
    }
  });

  btnRow.appendChild(loadBtn);
  btnRow.appendChild(cancelBtn);
  panel.appendChild(btnRow);
  backdrop.appendChild(panel);
  app.appendChild(backdrop);

  setTimeout(function() { ta.focus(); }, 30);
}

function renderRubricEditor(app) {
  var rubric = _library[editingRubricId];
  if (!rubric) {
    showRubricEditor = false;
    return;
  }

  var backdrop = document.createElement('div');
  backdrop.className = 'overlay-backdrop';

  var panel = document.createElement('div');
  panel.className = 'overlay-panel';
  panel.style.maxWidth = '820px';
  panel.setAttribute('role', 'dialog');
  panel.setAttribute('aria-modal', 'true');
  panel.setAttribute('aria-label', 'Edit Rubric JSON');

  var heading = document.createElement('h3');
  heading.textContent = 'Edit Rubric JSON';
  panel.appendChild(heading);

  var hint = document.createElement('p');
  hint.style.cssText = 'margin:0;font-size:0.82rem;color:#5a6a7e;';
  hint.textContent = 'Save validates the rubric and updates your local library.';
  panel.appendChild(hint);

  var textarea = document.createElement('textarea');
  textarea.value = JSON.stringify(rubric, null, 2);
  textarea.spellcheck = false;
  textarea.setAttribute('aria-label', 'Rubric JSON');
  textarea.style.minHeight = '55vh';
  textarea.style.maxHeight = 'calc(100vh - 250px)';
  panel.appendChild(textarea);

  var errorMessage = document.createElement('p');
  errorMessage.className = 'overlay-error';
  errorMessage.setAttribute('role', 'alert');
  panel.appendChild(errorMessage);

  var buttonRow = document.createElement('div');
  buttonRow.className = 'overlay-btn-row';

  var saveButton = document.createElement('button');
  saveButton.className = 'btn-overlay-load';
  saveButton.textContent = 'Save';
  saveButton.addEventListener('click', function() {
    var editedRubric;
    try {
      editedRubric = JSON.parse(textarea.value);
    } catch(e) {
      textarea.classList.add('invalid');
      errorMessage.textContent = 'Invalid JSON: ' + e.message;
      return;
    }
    var error = validateRubric(editedRubric);
    if (!error && editedRubric.rubric_id !== editingRubricId && _library[editedRubric.rubric_id]) {
      error = 'A rubric with this ID already exists.';
    }
    if (error) {
      textarea.classList.add('invalid');
      errorMessage.textContent = 'Validation error: ' + error;
      return;
    }

    textarea.classList.remove('invalid');
    if (editedRubric.rubric_id !== editingRubricId) deleteRubricFromLibrary(editingRubricId);
    saveRubricToLibrary(deepCopyAndReset(editedRubric));
    editingRubricId = '';
    showRubricEditor = false;
    libraryError = '';
    render();
  });

  var exportButton = document.createElement('button');
  exportButton.className = 'btn-overlay-cancel';
  exportButton.textContent = 'Export JSON';
  exportButton.addEventListener('click', function() {
    var editedRubric;
    try {
      editedRubric = JSON.parse(textarea.value);
    } catch(e) {
      errorMessage.textContent = 'Invalid JSON: ' + e.message;
      return;
    }
    var error = validateRubric(editedRubric);
    if (error) {
      errorMessage.textContent = 'Validation error: ' + error;
      return;
    }
    var filename = sanitizeFilename(editedRubric.title) + '.json';
    downloadFile(JSON.stringify(editedRubric, null, 2), filename, 'application/json');
    errorMessage.textContent = '';
  });

  var cancelButton = document.createElement('button');
  cancelButton.className = 'btn-overlay-cancel';
  cancelButton.textContent = 'Cancel';
  cancelButton.addEventListener('click', function() {
    editingRubricId = '';
    showRubricEditor = false;
    render();
  });

  backdrop.addEventListener('click', function(event) {
    if (event.target === backdrop) {
      editingRubricId = '';
      showRubricEditor = false;
      render();
    }
  });

  buttonRow.appendChild(saveButton);
  buttonRow.appendChild(exportButton);
  buttonRow.appendChild(cancelButton);
  panel.appendChild(buttonRow);
  backdrop.appendChild(panel);
  app.appendChild(backdrop);

  setTimeout(function() { textarea.focus(); }, 30);
}

function renderMarkdownOverlay(app) {
  var backdrop = document.createElement('div');
  backdrop.className = 'overlay-backdrop';

  var panel = document.createElement('div');
  panel.className = 'overlay-panel';
  panel.setAttribute('role', 'dialog');
  panel.setAttribute('aria-modal', 'true');
  panel.setAttribute('aria-label', 'Export Markdown');

  var heading = document.createElement('h3');
  heading.textContent = 'Markdown Export';
  panel.appendChild(heading);

  var textarea = document.createElement('textarea');
  textarea.readOnly = true;
  textarea.setAttribute('aria-label', 'Markdown content');
  textarea.value = buildMarkdown();
  panel.appendChild(textarea);

  var buttonRow = document.createElement('div');
  buttonRow.className = 'overlay-btn-row';

  var downloadButton = document.createElement('button');

  downloadButton.addEventListener('click', function() {
    var filename = sanitizeFilename(studentName) + '_' + sanitizeFilename(activeRubric.rubric_id) + '_Rubric.md';

// ── Welcome screen ─────────────────────────────────────────────────────────
function renderWelcome(app) {
  var wrap = document.createElement('div');
  wrap.className = 'welcome-wrap';

  var card = document.createElement('div');
  card.className = 'welcome-card';

  var badge = document.createElement('span');
  badge.style.cssText = 'display:inline-block;background:#1a2e4a;color:#fff;font-size:0.7rem;font-weight:700;padding:0.2rem 0.6rem;border-radius:4px;letter-spacing:0.05em;margin-bottom:0.5rem;';
  badge.textContent = 'MYP Design Self-Assessment';
  card.appendChild(badge);

  var h2 = document.createElement('h2');
  h2.textContent = activeRubric ? activeRubric.title : 'Rubric Checker';
  card.appendChild(h2);

  var desc = document.createElement('p');
  desc.textContent = 'Enter your name to begin checking your rubric.';
  card.appendChild(desc);

  var backBtn = document.createElement('button');
  backBtn.style.cssText = 'background:none;border:none;color:#1a2e4a;font-size:0.85rem;font-weight:600;cursor:pointer;padding:0;margin-bottom:1rem;text-decoration:underline;font-family:inherit;';
  backBtn.textContent = 'Back to Rubric Library';
  backBtn.addEventListener('click', function() {
    currentView = 'library';
    libraryError = '';
    render();
  });
  card.appendChild(backBtn);

  var label = document.createElement('label');
  label.setAttribute('for', 'student-name');
  label.textContent = 'Enter your name:';
  card.appendChild(label);

  var input = document.createElement('input');
  input.type = 'text';
  input.id = 'student-name';
  input.placeholder = 'e.g. Alex Chen';
  input.autocomplete = 'name';
  input.setAttribute('aria-describedby', 'name-error');
  card.appendChild(input);

  var errorMsg = document.createElement('p');
  errorMsg.className = 'error-msg';
  errorMsg.id = 'name-error';
  errorMsg.setAttribute('role', 'alert');
  errorMsg.setAttribute('aria-live', 'assertive');
  errorMsg.textContent = '';
  card.appendChild(errorMsg);

  var startBtn = document.createElement('button');
  startBtn.className = 'btn-start';
  startBtn.textContent = 'Start';
  card.appendChild(startBtn);

  function tryStart() {
    var val = input.value.trim();
    if (!val) {
      input.classList.add('invalid');
      errorMsg.textContent = 'Please enter your name to continue.';
      input.focus();
      return;
    }
    input.classList.remove('invalid');
    errorMsg.textContent = '';
    studentName = val;
    currentView = 'full';
    render();
  }

  startBtn.addEventListener('click', tryStart);
  input.addEventListener('keydown', function(e) { if (e.key === 'Enter') tryStart(); });
  input.addEventListener('input', function() {
    if (input.value.trim()) {
      input.classList.remove('invalid');
      errorMsg.textContent = '';
    }
  });

  wrap.appendChild(card);
  app.appendChild(wrap);

  setTimeout(function() { input.focus(); }, 50);
}

// ── Main render ────────────────────────────────────────────────────────────
function render() {
  var app = document.getElementById('app');
  app.innerHTML = '';

  if (currentView === 'library') {
    renderLibrary(app);
    return;
  }

  if (currentView === 'welcome') {
    renderWelcome(app);
    return;
  }

  // Header
  var header = document.createElement('header');
  header.className = 'app-header';

  var headerText = document.createElement('div');
  headerText.className = 'app-header-text';
  var h1 = document.createElement('h1');
  h1.textContent = activeRubric ? activeRubric.title : 'Rubric Checker';
  var sub = document.createElement('p');
  sub.className = 'header-sub';
  sub.textContent = 'Student: ' + studentName;
  headerText.appendChild(h1);
  headerText.appendChild(sub);

  var changeBtn = document.createElement('button');
  changeBtn.className = 'btn-change-rubric';
  changeBtn.textContent = 'Change Rubric';
  changeBtn.addEventListener('click', function() {
    currentView = 'library';
    studentName = '';
    libraryError = '';
    render();
  });

  header.appendChild(headerText);
  header.appendChild(changeBtn);
  app.appendChild(header);

  // Progress
  app.appendChild(renderProgressBar());

  // View toggle bar
  var toggleBar = document.createElement('div');
  toggleBar.className = 'view-toggle-bar';
  var availableTags = getRubricTags(activeRubric);

  var fullBtn = document.createElement('button');
  fullBtn.className = 'toggle-btn' + (currentView === 'full' ? ' active' : '');
  fullBtn.textContent = 'Full View';
  fullBtn.setAttribute('aria-pressed', currentView === 'full' ? 'true' : 'false');
  fullBtn.addEventListener('click', function() { currentView = 'full'; render(); });

  var focusBtn = document.createElement('button');
  focusBtn.className = 'toggle-btn' + (currentView === 'focus' ? ' active' : '');
  focusBtn.textContent = 'Focus Mode';
  focusBtn.setAttribute('aria-pressed', currentView === 'focus' ? 'true' : 'false');
  focusBtn.addEventListener('click', function() { currentView = 'focus'; render(); });

  toggleBar.appendChild(fullBtn);
  toggleBar.appendChild(focusBtn);

  if (availableTags.length) {
    var tagModeBtn = document.createElement('button');
    tagModeBtn.className = 'toggle-btn' + (currentView === 'tag' ? ' active' : '');
    tagModeBtn.textContent = 'Tag Mode';
    tagModeBtn.setAttribute('aria-pressed', currentView === 'tag' ? 'true' : 'false');
    tagModeBtn.addEventListener('click', function() {
      if (availableTags.indexOf(selectedTag) === -1) selectedTag = availableTags[0];
      currentView = 'tag';
      render();
    });
    toggleBar.appendChild(tagModeBtn);
  }

  var commentsBtn = document.createElement('button');
  commentsBtn.className = 'toggle-btn' + (commentsExpanded ? ' active' : '');
  commentsBtn.textContent = 'Comments';
  commentsBtn.setAttribute('aria-expanded', commentsExpanded ? 'true' : 'false');
  commentsBtn.setAttribute('aria-controls', 'comments-section');
  commentsBtn.addEventListener('click', function() {
    commentsExpanded = !commentsExpanded;
    render();
  });
  toggleBar.appendChild(commentsBtn);

  app.appendChild(toggleBar);

  var commentsPanel = document.createElement('section');
  commentsPanel.className = 'comments-panel';
  commentsPanel.id = 'comments-section';
  commentsPanel.hidden = !commentsExpanded;
  var commentsLabel = document.createElement('label');
  commentsLabel.setAttribute('for', 'assessment-comments');
  commentsLabel.textContent = 'Comments';
  var commentsTextarea = document.createElement('textarea');
  commentsTextarea.id = 'assessment-comments';
  commentsTextarea.value = assessmentComments;
  commentsTextarea.placeholder = 'Add comments for this assessment';
  commentsTextarea.addEventListener('input', function() {
    assessmentComments = commentsTextarea.value;
  });
  commentsPanel.appendChild(commentsLabel);
  commentsPanel.appendChild(commentsTextarea);
  app.appendChild(commentsPanel);

  // Focus mode band selector
  if (currentView === 'focus') {
    var bandBar = document.createElement('div');
    bandBar.className = 'band-selector';
    var lbl = document.createElement('span');
    lbl.style.fontWeight = '600';
    lbl.style.fontSize = '0.875rem';
    lbl.textContent = 'Band:';
    bandBar.appendChild(lbl);

    ['3-4', '5-6', '7-8'].forEach(function(band) {
      var bb = document.createElement('button');
      bb.className = 'band-btn' + (focusBand === band ? ' active' : '');
      bb.textContent = band;
      bb.setAttribute('aria-pressed', focusBand === band ? 'true' : 'false');
      bb.addEventListener('click', function() { focusBand = band; render(); });
      bandBar.appendChild(bb);
    });

    var backBtn = document.createElement('button');
    backBtn.className = 'toggle-btn';
    backBtn.style.marginLeft = 'auto';
    backBtn.textContent = 'Back to Full View';
    backBtn.addEventListener('click', function() { currentView = 'full'; render(); });
    bandBar.appendChild(backBtn);

    app.appendChild(bandBar);
  }

  if (currentView === 'tag') {
    var tagBar = document.createElement('div');
    tagBar.className = 'band-selector';
    var tagLabel = document.createElement('span');
    tagLabel.style.fontWeight = '600';
    tagLabel.style.fontSize = '0.875rem';
    tagLabel.textContent = 'Tag:';
    tagBar.appendChild(tagLabel);

    availableTags.forEach(function(tag) {
      var tagBtn = document.createElement('button');
      tagBtn.className = 'band-btn' + (selectedTag === tag ? ' active' : '');
      tagBtn.textContent = tag;
      tagBtn.setAttribute('aria-pressed', selectedTag === tag ? 'true' : 'false');
      tagBtn.addEventListener('click', function() {
        selectedTag = tag;
        render();
      });
      tagBar.appendChild(tagBtn);
    });

    app.appendChild(tagBar);
  }

  // Main content
  var main = document.createElement('main');
  main.className = 'main-content' + (currentView === 'focus' ? ' focus-mode' : '');

  var grid = document.createElement('div');
  grid.className = currentView === 'focus' ? 'focus-grid' : 'criteria-grid';

  activeRubric.criteria.forEach(function(criterion) {
    var bandFilter = currentView === 'focus' ? focusBand : null;
    var tagFilter = currentView === 'tag' ? selectedTag : null;
    var criterionCard = renderCriterionCard(criterion, bandFilter, tagFilter);
    if (criterionCard) grid.appendChild(criterionCard);
  });

  main.appendChild(grid);
  app.appendChild(main);

  // Export footer
  var footer = document.createElement('div');
  footer.className = 'export-footer';

  var mdBtn = document.createElement('button');
  mdBtn.className = 'btn-export';
  mdBtn.textContent = 'Export Markdown';
  mdBtn.addEventListener('click', exportMarkdown);

  var jsonBtn = document.createElement('button');
  jsonBtn.className = 'btn-export';
  jsonBtn.textContent = 'Export JSON';
  jsonBtn.addEventListener('click', exportJSON);

  var loadCompletedBtn = document.createElement('button');
  loadCompletedBtn.className = 'btn-export';
  loadCompletedBtn.textContent = 'Load completed JSON';
  loadCompletedBtn.addEventListener('click', function() {
    var input = document.getElementById('completed-import-input');
    input.value = '';
    input.click();
  });

  var completedLoadStatus = document.createElement('span');
  completedLoadStatus.setAttribute('role', 'status');
  completedLoadStatus.setAttribute('aria-live', 'polite');
  completedLoadStatus.style.cssText = 'align-self:center;font-size:0.82rem;color:' + (completedLoadMessage && completedLoadMessage.indexOf('Loaded completed assessment for ') !== 0 ? '#b91c1c' : '#166534') + ';';
  completedLoadStatus.textContent = completedLoadMessage;

  var copyBtn = document.createElement('button');
  copyBtn.className = 'btn-export';
  copyBtn.textContent = 'Copy for Google Docs';

  var copyStatus = document.createElement('span');
  copyStatus.setAttribute('role', 'status');
  copyStatus.setAttribute('aria-live', 'polite');
  copyStatus.style.cssText = 'align-self:center;color:#166534;font-size:0.82rem;';
  copyBtn.addEventListener('click', function() { copyForGoogleDocs(copyStatus); });

  footer.appendChild(mdBtn);
  footer.appendChild(jsonBtn);
  footer.appendChild(loadCompletedBtn);
  footer.appendChild(completedLoadStatus);
  footer.appendChild(copyBtn);
  footer.appendChild(copyStatus);
  app.appendChild(footer);

  if (showMarkdownOverlay) {
    renderMarkdownOverlay(app);
  }
}

// ── File import wiring ─────────────────────────────────────────────────────
document.getElementById('file-import-input').addEventListener('change', function(e) {
  var file = e.target.files && e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    var err = importRubricJSON(ev.target.result);
    if (err) {
      libraryError = err;
    } else {
      libraryError = '';
    }
    render();
  };
  reader.readAsText(file);
});

document.getElementById('completed-import-input').addEventListener('change', function(e) {
  var file = e.target.files && e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    var err = loadCompletedRubricJSON(ev.target.result);
    if (err) completedLoadMessage = err;
    render();
  };
  reader.onerror = function() {
    completedLoadMessage = 'Could not read the selected file.';
    render();
  };
  reader.readAsText(file);
});

// ── Boot ───────────────────────────────────────────────────────────────────
render();
</script>
